[project]
name = "chintai-sagashi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "boto3>=1.40.50",
    "dbt>=1.0.0.40.18",
    "dbt-duckdb>=1.11.0",
    "duckdb==1.5.2",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.1",
    "requests>=2.32.3",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "duckdb>=1.2.2",
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
]
